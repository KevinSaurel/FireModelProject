<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/Static/LogoFire.PNG">
    <title data-i18n="map.liveTitle">Live Wildfire Risk - Euskadi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        .legend .tiers div { margin-top: 7px; letter-spacing: 0.06em; text-transform: none; font-size: 12px; }
        .legend .sw { display: inline-block; width: 11px; height: 11px; margin-right: 9px; vertical-align: -1px; }
        .leaflet-container { cursor: pointer; }
        .leaflet-popup-content { font-family: 'Montserrat', Arial, sans-serif; font-size: 13px; line-height: 1.5; }
        .popup-tier { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
        a.popup-btn {
            display: inline-block; margin-top: 8px; padding: 8px 14px; background: #08141f; color: #fff !important;
            font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none;
        }
        a.popup-btn:hover { background: #f0a35e; color: #1a1209 !important; }
    </style>
</head>
<body>

<nav class="nav solid">
    <div class="nav-brand-group">
        <a class="brand" href="/"><img src="/Static/LogoFire.PNG" alt=""><span>Euskadi Fire Risk</span></a>
        <div class="language-picker" id="language-picker"></div>
    </div>
    <ul>
        <li><a class="link" href="/" data-i18n="nav.home">Home</a></li>
        <li><a class="link active" id="nav-live" href="LiveFireRisk.html" data-i18n="nav.live">Live Risk</a></li>
        <li><a class="link" id="nav-forecast" href="LiveFireRisk.html?mode=forecast" data-i18n="nav.forecast">Forecast Risk</a></li>
        <li><a class="link" href="Info.html" data-i18n="nav.info">Information</a></li>
    </ul>
</nav>

<div class="panel">
    <h3 id="panel-title" data-i18n="map.liveTitle">Live Risk</h3>
    <div id="status" data-i18n="map.loading">Loading live data...</div>
    <div class="controls">
        <button class="btn small" onclick="load(true)" data-i18n="map.refresh">Refresh</button>
        <span>
            <input type="checkbox" id="chk-stations" checked onchange="toggleStations()">
            <label for="chk-stations" data-i18n="map.stations">Stations</label>
        </span>
    </div>
</div>

<div class="legend">
    <span data-i18n="map.probability">Wildfire probability</span>
    <div class="tiers">
        <div><span class="sw" style="background:#38a169"></span><span data-i18n="legend.low">Low: P &lt; 0.35</span></div>
        <div><span class="sw" style="background:#ecc94b"></span><span data-i18n="legend.medium">Medium: 0.35 &le; P &lt; 0.50</span></div>
        <div><span class="sw" style="background:#dd6b20"></span><span data-i18n="legend.high">High: 0.50 &le; P &lt; 0.70</span></div>
        <div><span class="sw" style="background:#e53e3e"></span><span data-i18n="legend.extreme">Extreme: P &ge; 0.70</span></div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/translations/translations.js"></script>
<script src="/translations/i18n.js"></script>

<script>
    // Mismo origen cuando lo sirve FastAPI; localhost si se abre como archivo.
    const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';

    // Misma pagina para los dos modos: ?mode=forecast usa la prevision de manana.
    const MODE = new URLSearchParams(location.search).get('mode') === 'forecast' ? 'forecast' : 'live';
    if (MODE === 'forecast') {
        document.title = t('map.forecastTitle');
        document.getElementById('panel-title').dataset.i18n = 'map.forecastTitle';
        document.getElementById('panel-title').textContent = t('map.forecastTitle');
        document.getElementById('nav-live').classList.remove('active');
        document.getElementById('nav-forecast').classList.add('active');
    }

    // Backend grid bounds (must match EUSKADI_BOUNDS in main.py)
    const EUSKADI_BOUNDS = { lat_min: 42.47, lat_max: 43.45, lon_min: -3.45, lon_max: -1.73 };
    const COS_LAT = Math.cos(43.0 * Math.PI / 180);

    // Model probability thresholds (tier_thresholds.json)
    const T_MEDIUM = 0.35;
    const T_HIGH = 0.50;
    const T_EXTREME = 0.70;

    const TIER_COLORS = {
        LOW:     [56, 161, 105],    // verde
        MEDIUM:  [236, 201, 75],    // amarillo
        HIGH:    [221, 107, 32],    // naranja
        EXTREME: [229, 62, 62],     // rojo
    };
    function getRiskTierLabel(tierKey) {
        return t(`tier.${tierKey.toLowerCase()}`);
    }

    function tierOf(p) {
        return p >= T_EXTREME ? 'EXTREME' : p >= T_HIGH ? 'HIGH' : p >= T_MEDIUM ? 'MEDIUM' : 'LOW';
    }
    function riskColor(p) {
        return `rgb(${TIER_COLORS[tierOf(p)].join(',')})`;
    }

    // ---- Local calculations using data already provided by the API ----
    // Probability for the map cell that was clicked (the value that determines its color).
    function cellProbability(points, n, lat, lon) {
        const B = EUSKADI_BOUNDS;
        const r = Math.round((lat - B.lat_min) / (B.lat_max - B.lat_min) * (n - 1));
        const c = Math.round((lon - B.lon_min) / (B.lon_max - B.lon_min) * (n - 1));
        const row = Math.max(0, Math.min(n - 1, r));
        const col = Math.max(0, Math.min(n - 1, c));
        return points[row * n + col].probability;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
        const rad = Math.PI / 180;
        const a = Math.sin((lat2 - lat1) * rad / 2) ** 2
            + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin((lon2 - lon1) * rad / 2) ** 2;
        return 2 * 6371 * Math.asin(Math.sqrt(a));
    }

    // Nearest measurement points and their interpolation weights (1 / distance^2).
    function nearbySources(samples, lat, lon, limit) {
        const list = samples.map(s => {
            const d = Math.max(Math.hypot(lat - s.lat, (lon - s.lon) * COS_LAT), 1e-6);
            return { s, w: 1 / (d * d), km: haversineKm(lat, lon, s.lat, s.lon) };
        });
        const total = list.reduce((a, x) => a + x.w, 0);
        list.forEach(x => { x.pct = 100 * x.w / total; });
        return list.sort((a, b) => b.w - a.w).slice(0, limit);
    }

    function sourceName(s) {
        if (s.name) return MODE === 'forecast'
            ? t('map.forecastFor', { name: s.name })
            : t('map.station', { name: s.name });
        return t('map.openMeteoGrid');
    }

    function translateSource(source) {
        if (source === 'Open-Meteo') return t('map.sourceOpenMeteo');
        if (source === 'Open-Meteo (forecast)') return t('map.sourceOpenMeteo');
        if (source === 'Euskalmet + Open-Meteo history') return t('map.sourceEuskalmetHistory');
        return source;
    }

    const map = L.map('map').setView([43.0, -2.6], 9);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
        maxZoom: 16
    }).addTo(map);

    // Keep the probability layer below the station markers.
    map.createPane('probPane');
    map.getPane('probPane').style.zIndex = 350;
    map.getPane('probPane').style.pointerEvents = 'none';

    let probLayer = null;
    let lastData = null;
    let statusError = null;
    let loading = false;
    const stationLayer = L.layerGroup().addTo(map);

    function updateStatus() {
        const status = document.getElementById('status');
        if (statusError) {
            status.textContent = statusError === 'connection' ? t('map.connectionError') : statusError;
        } else if (loading || !lastData) {
            status.textContent = t('map.loadingLong');
        } else if (MODE === 'forecast') {
            status.textContent = t('map.forecastStatus', {
                date: lastData.date,
                stations: lastData.counts.euskalmet,
                points: lastData.counts.open_meteo
            });
        } else {
            status.textContent = t('map.liveStatus', {
                date: lastData.date,
                stations: lastData.counts.euskalmet,
                points: lastData.counts.open_meteo
            });
        }
    }

    function renderStations(data) {
        stationLayer.clearLayers();
        data.stations.forEach(s => {
            L.circleMarker([s.lat, s.lon], {
                radius: 5, color: '#08141f', weight: 1,
                fillColor: riskColor(s.probability), fillOpacity: 0.9,
                bubblingMouseEvents: false
            }).bindPopup(
                popupHtml(
                    s.name, s.probability, s.lat, s.lon,
                    `<b>${t('map.temperature')}:</b> ${s.temperature} °C | <b>${t('map.humidity')}:</b> ${s.humidity}%<br/>
                     <b>${t('map.wind')}:</b> ${s.wind_speed} km/h | <b>${t('map.rainfall7d')}:</b> ${s.rain_7d} mm<br/>
                     <b>${t('map.dryDays')}:</b> ${s.dry_streak}<br/>
                     <small>${t('map.source')}: ${translateSource(s.source)}</small><br/>`
                )
            ).addTo(stationLayer);
        });
        toggleStations();
    }

    // Shared popup content: risk tier, probability, and details button.
    function popupHtml(title, p, lat, lon, extra = '') {
        return `<strong>${title}</strong><br/>
            <span class="popup-tier" style="background:${riskColor(p)}"></span>${getRiskTierLabel(tierOf(p))}
            &middot; ${(p * 100).toFixed(2)}%<br/>
            ${extra}
            <a class="popup-btn" href="Detail.html?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&mode=${MODE}">${t('map.viewDetails')}</a>`;
    }

    // Clicking the map shows a popup with the value, main source, and details link.
    map.on('click', (e) => {
        const { lat, lng } = e.latlng;
        if (!lastData) {
            L.popup().setLatLng(e.latlng).setContent(t('map.loadingPopup')).openOn(map);
            return;
        }
        const p = cellProbability(lastData.points, lastData.grid_size, lat, lng);
        let extra = '';
        if (lastData.samples && lastData.samples.length) {
            const main = nearbySources(lastData.samples, lat, lng, 1)[0];
            extra = `<small>${t('map.mainSource')}: ${sourceName(main.s)} (${main.km.toFixed(1)} km)</small><br/>`;
        }
        L.popup().setLatLng(e.latlng).setContent(popupHtml(t('map.selectedPoint'), p, lat, lng, extra)).openOn(map);
    });

    // Convierte la malla n x n de la API en una imagen anclada a coordenadas.
    // El color depende solo de la probabilidad, no del nivel de zoom.
    function buildProbabilityOverlay(points, n) {
        const canvas = document.createElement('canvas');
        canvas.width = n;
        canvas.height = n;
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(n, n);

        // Los puntos vienen ordenados por latitud (filas, de sur a norte) y luego por longitud.
        points.forEach((p, idx) => {
            const row = Math.floor(idx / n);
            const col = idx % n;
            const y = n - 1 - row;                      // el norte va arriba
            const [r, g, b] = TIER_COLORS[tierOf(p.probability)];
            const o = (y * n + col) * 4;
            img.data[o] = r;
            img.data[o + 1] = g;
            img.data[o + 2] = b;
            img.data[o + 3] = Math.round(255 * Math.max(0, Math.min(1, p.intensity)));
        });
        ctx.putImageData(img, 0, 0);

        const B = EUSKADI_BOUNDS;
        const halfLat = (B.lat_max - B.lat_min) / (n - 1) / 2;   // cada celda esta centrada en su punto
        const halfLon = (B.lon_max - B.lon_min) / (n - 1) / 2;
        return L.imageOverlay(canvas.toDataURL(), [
            [B.lat_min - halfLat, B.lon_min - halfLon],
            [B.lat_max + halfLat, B.lon_max + halfLon],
        ], { pane: 'probPane', interactive: false });
    }

    async function load(refresh = false) {
        loading = true;
        statusError = null;
        updateStatus();
        try {
            const res = await fetch(`${API}/api/v1/fire-risk/heatmap?resolution=50&mode=${MODE}${refresh ? '&refresh=true' : ''}`);
            const data = await res.json();
            if (data.error) {
                statusError = data.error;
                return;
            }
            lastData = data;

            if (probLayer) map.removeLayer(probLayer);
            probLayer = buildProbabilityOverlay(data.points, data.grid_size).addTo(map);
            renderStations(data);
        } catch (e) {
            statusError = 'connection';
            console.error(e);
        } finally {
            loading = false;
            updateStatus();
        }
    }

    function toggleStations() {
        const on = document.getElementById('chk-stations').checked;
        if (on) stationLayer.addTo(map); else map.removeLayer(stationLayer);
    }

    window.addEventListener('app-language-changed', () => {
        if (MODE === 'forecast') document.title = t('map.forecastTitle');
        else document.title = t('map.liveTitle');
        updateStatus();
        if (lastData) {
            map.closePopup();
            renderStations(lastData);
        }
    });

    load();
</script>
</body>
</html>
