<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/Static/LogoFire.PNG">
    <title data-i18n="detail.title">Point Details - Euskadi Fire Risk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        .result { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
        .result .swatch { width: 64px; height: 64px; flex: none; }
        .result .tier { font-weight: 300; font-size: 34px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.1; }
        .result .prob { font-weight: 300; font-size: 16px; color: var(--muted); margin-top: 4px; }
        table.t { width: 100%; border-collapse: collapse; font-size: 14px; font-weight: 300; }
        table.t th {
            text-align: left; font-weight: 500; font-size: 11px; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--accent); padding: 8px 10px 10px 0;
        }
        table.t td { padding: 10px 10px 10px 0; border-top: 1px solid var(--line); vertical-align: middle; }
        .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; }
        .bar-wrap { background: rgba(255, 255, 255, 0.1); height: 6px; width: 100%; min-width: 80px; }
        .bar-fill { background: var(--accent); height: 6px; }
        .note { font-size: 13px; color: var(--muted); font-weight: 300; margin-top: 12px; line-height: 1.6; }
        .txt { margin: 0 0 12px 0; font-weight: 300; line-height: 1.75; }
        .back { display: inline-block; margin-top: 8px; }
        .scale li.current { font-weight: 500; }
        @media (max-width: 760px) { table.t { font-size: 12px; } .result .tier { font-size: 26px; } }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand-group">
            <a class="brand" href="/"><img src="/Static/LogoFire.PNG" alt=""><span>Euskadi Fire Risk</span></a>
            <div class="language-picker" id="language-picker"></div>
        </div>
        <ul>
            <li><a class="link" href="/" data-i18n="nav.home">Home</a></li>
            <li><a class="link" href="LiveFireRisk.html" data-i18n="nav.live">Live Risk</a></li>
            <li><a class="link" href="LiveFireRisk.html?mode=forecast" data-i18n="nav.forecast">Forecast Risk</a></li>
            <li><a class="link" href="Info.html" data-i18n="nav.info">Information</a></li>
        </ul>
    </nav>

    <section class="page-hero" style="height: 34vh; min-height: 240px;">
        <div class="sky"></div>
        <div class="sun" style="bottom: 8%;"></div>
        <svg class="mountains" viewBox="0 0 1440 400" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#3a5f86" opacity="0.65" d="M0,220 L180,140 L320,200 L520,90 L700,210 L860,130 L1040,220 L1220,120 L1440,200 L1440,400 L0,400 Z"/>
            <path fill="#1d3a58" d="M0,280 L150,220 L300,270 L480,190 L660,280 L820,230 L1000,290 L1180,210 L1440,280 L1440,400 L0,400 Z"/>
            <path fill="#08141f" d="M0,330 L200,290 L400,330 L620,280 L840,335 L1060,295 L1260,335 L1440,300 L1440,400 L0,400 Z"/>
        </svg>
        <h1 id="page-title" data-i18n="detail.title">Point Details</h1>
    </section>

    <main class="page-body">
        <div class="inner" id="content">
            <p class="txt" data-i18n="detail.loading">Loading details...</p>
        </div>
    </main>

<script src="/translations/translations.js"></script>
<script src="/translations/i18n.js"></script>
<script>
    const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';

    // Misma pagina para los dos modos: ?mode=forecast muestra el detalle de la prevision de manana.
    const MODE = new URLSearchParams(location.search).get('mode') === 'forecast' ? 'forecast' : 'live';
    const FORECAST = MODE === 'forecast';
    const BACK_URL = FORECAST ? 'LiveFireRisk.html?mode=forecast' : 'LiveFireRisk.html';
    if (FORECAST) {
        document.title = t('detail.forecastTitle');
        document.getElementById('page-title').dataset.i18n = 'detail.forecastTitle';
        document.getElementById('page-title').textContent = t('detail.forecastTitle');
    }

    // Limites de la malla del backend (deben coincidir con EUSKADI_BOUNDS en main.py)
    const EUSKADI_BOUNDS = { lat_min: 42.47, lat_max: 43.45, lon_min: -3.45, lon_max: -1.73 };
    const COS_LAT = Math.cos(43.0 * Math.PI / 180);

    // Umbrales de probabilidad del modelo (tier_thresholds.json)
    const TIERS = [
        { key: 'LOW',     color: '#38a169', lo: 0,    hi: 0.35 },
        { key: 'MEDIUM',  color: '#ecc94b', lo: 0.35, hi: 0.50 },
        { key: 'HIGH',    color: '#dd6b20', lo: 0.50, hi: 0.70 },
        { key: 'EXTREME', color: '#e53e3e', lo: 0.70, hi: 1 },
    ];
    const tierOf = p => TIERS.slice().reverse().find(t => p >= t.lo) || TIERS[0];

    const FEATURES = {
        temperature:    ['feature.temperature', '°C'],
        humidity:       ['feature.humidity', '%'],
        min_humidity:   ['feature.minHumidity', '%'],
        wind_speed:     ['feature.wind', 'km/h'],
        max_wind_speed: ['feature.maxWind', 'km/h'],
        precip_1d:      ['feature.rain1', 'mm'],
        precip_7d:      ['feature.rain7', 'mm'],
        precip_14d:     ['feature.rain14', 'mm'],
        precip_30d:     ['feature.rain30', 'mm'],
        dry_spell_days: ['feature.dryDays', 'days'],
        et0_14d:        ['feature.evapotranspiration', 'mm'],
        month:          ['feature.month', ''],
        day_of_year:    ['feature.dayOfYear', ''],
    };

    const pct = (x, d = 1) => (x * 100).toFixed(d) + '%';
    const num = (x, d = 1) => Number(x).toFixed(d);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const params = new URLSearchParams(location.search);
    const lat = parseFloat(params.get('lat'));
    const lon = parseFloat(params.get('lon'));
    const content = document.getElementById('content');
    let detailData = null;
    let detailMessage = null;

    // ---- Calculos locales sobre los datos que envia la API ----
    function cellProbability(points, n, la, lo) {
        const B = EUSKADI_BOUNDS;
        const r = Math.round((la - B.lat_min) / (B.lat_max - B.lat_min) * (n - 1));
        const c = Math.round((lo - B.lon_min) / (B.lon_max - B.lon_min) * (n - 1));
        const row = Math.max(0, Math.min(n - 1, r));
        const col = Math.max(0, Math.min(n - 1, c));
        return points[row * n + col].probability;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
        const rad = Math.PI / 180;
        const a = Math.sin((lat2 - lat1) * rad / 2) ** 2
            + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin((lon2 - lon1) * rad / 2) ** 2;
        return 2 * 6371 * Math.asin(Math.sqrt(a));
    }

    function nearbySources(samples, la, lo, limit) {
        const list = samples.map(s => {
            const d = Math.max(Math.hypot(la - s.lat, (lo - s.lon) * COS_LAT), 1e-6);
            return { s, w: 1 / (d * d), km: haversineKm(la, lo, s.lat, s.lon) };
        });
        const total = list.reduce((a, x) => a + x.w, 0);
        list.forEach(x => { x.pct = 100 * x.w / total; });
        return list.sort((a, b) => b.w - a.w).slice(0, limit);
    }

    const isStation = s => !!s.name;
    const sourceName = s => isStation(s)
        ? (FORECAST ? t('map.forecastFor', { name: s.name }) : t('map.station', { name: s.name }))
        : `${t('map.openMeteoGrid')} ${num(s.lat, 2)}, ${num(s.lon, 2)}`;
    const sourceKind = s => FORECAST
        ? t('map.sourceOpenMeteo')
        : (isStation(s) ? t('map.sourceEuskalmetHistory') : t('map.sourceOpenMeteo'));

    function row(titleKey, html) {
        return `<div class="row"><h2>${t(titleKey)}</h2><div>${html}</div></div>`;
    }

    function showMessage(key, withBackLink = false, rawMessage = null) {
        detailData = null;
        detailMessage = { key, withBackLink, rawMessage };
        const message = rawMessage === null ? t(key) : rawMessage;
        const translationAttribute = key ? ` data-i18n="${key}"` : '';
        content.innerHTML = `<p class="txt"${translationAttribute}>${esc(message)}</p>${withBackLink ? `<a class="btn small" href="${BACK_URL}">${t('detail.goToMap')}</a>` : ''}`;
    }

    function render(d) {
        detailData = d;
        detailMessage = null;
        const p = cellProbability(d.points, d.grid_size, lat, lon);
        const riskTier = tierOf(p);
        const tierLabel = t(`tier.${riskTier.key.toLowerCase()}`);
        const near = nearbySources(d.samples, lat, lon, 5);
        const main = near[0];

        const imps = d.importances || [];
        const impMap = {};
        let maxImp = 0;
        imps.forEach(i => { impMap[i.feature] = i.importance; maxImp = Math.max(maxImp, i.importance); });

        // 1. Resultado
        let html = row('detail.result', `
            <div class="result">
                <div class="swatch" style="background:${riskTier.color}"></div>
                <div>
                    <div class="tier">${tierLabel}</div>
                    <div class="prob">${t('detail.probability')}: ${pct(p, 2)}</div>
                </div>
            </div>
            <p class="note">${t('detail.coordinates')}: ${num(lat, 4)}, ${num(lon, 4)}${d.date ? ` &middot; ${FORECAST ? t('detail.forecastFor') : t('detail.dataFor')} ${esc(d.date)}` : ''}<br/>
            ${t('detail.mainSource')}: ${esc(sourceName(main.s))} (${num(main.km)} km)</p>
            <a class="btn small back" href="${BACK_URL}">${t('detail.backToMap')}</a>`);

        // 2. Por que este color
        html += row('detail.whyColor', `
            <p class="txt">${esc(t('detail.colorExplanation', {
                probability: pct(p, 2),
                tier: tierLabel,
                low: pct(riskTier.lo),
                high: pct(riskTier.hi)
            }))}</p>
            <p class="txt">${esc(t('detail.interpolationExplanation', {
                source: sourceName(main.s),
                weight: num(main.pct)
            }))}</p>`);

        // 3. Fuente de la informacion
        html += row('detail.sources', `
            <table class="t">
                <tr><th>${t('detail.point')}</th><th>${t('detail.source')}</th><th>${t('detail.distance')}</th><th>${t('detail.weight')}</th><th>${t('detail.probabilityHeader')}</th></tr>
                ${near.map(x => {
                    const ct = tierOf(x.s.probability);
                    return `<tr>
                        <td>${esc(sourceName(x.s))}</td>
                        <td>${esc(sourceKind(x.s))}</td>
                        <td>${num(x.km)} km</td>
                        <td>${num(x.pct)} %</td>
                        <td><span class="dot" style="background:${ct.color}"></span>${pct(x.s.probability, 2)}</td>
                    </tr>`;
                }).join('')}
            </table>
            <p class="note">${esc(FORECAST
                ? t('detail.forecastNote', { date: d.date })
                : t('detail.liveNote'))}</p>`);

        // 4. Condiciones del punto principal
        const feats = main.s.features || {};
        const keys = Object.keys(feats);
        html += row('detail.conditions', `
            <table class="t">
                <tr><th>${t('detail.variable')}</th><th>${t('detail.value')}</th><th>${t('detail.modelImportance')}</th></tr>
                ${keys.map(k => {
                    const [labelKey, unit] = FEATURES[k] || [null, ''];
                    const label = labelKey ? t(labelKey) : k;
                    const translatedUnit = unit === 'days' ? t('unit.days') : unit;
                    const imp = impMap[k];
                    const w = imp && maxImp ? Math.round(100 * imp / maxImp) : 0;
                    return `<tr>
                        <td>${esc(label)}</td>
                        <td>${num(feats[k], 1)} ${translatedUnit}</td>
                        <td>${imp !== undefined ? `<div class="bar-wrap"><div class="bar-fill" style="width:${w}%"></div></div>` : '-'}</td>
                    </tr>`;
                }).join('')}
            </table>
            <p class="note">${esc(t('detail.importanceNote', {
                mode: FORECAST ? t('detail.forecastValues') : t('detail.values'),
                source: sourceName(main.s)
            }))}</p>`);

        // 5. Escala
        html += row('detail.riskScale', `
            <ul class="scale" style="list-style:none; padding:0; margin:0;">
                ${TIERS.map(x => `<li class="${x.key === riskTier.key ? 'current' : ''}" style="margin-bottom:8px; font-weight:300;">
                    <span class="dot" style="background:${x.color}"></span>${t(`tier.${x.key.toLowerCase()}`)}: ${pct(x.lo)} ${t('detail.to')} ${pct(x.hi)}${x.key === riskTier.key ? ` ${t('detail.thisPoint')}` : ''}
                </li>`).join('')}
            </ul>`);

        content.innerHTML = html;
    }

    async function init() {
        if (isNaN(lat) || isNaN(lon)) {
            showMessage('detail.noLocation', true);
            return;
        }
        try {
            // Mismos datos (y misma cache del servidor) que usa el mapa
            const res = await fetch(`${API}/api/v1/fire-risk/heatmap?resolution=50&mode=${MODE}`);
            const d = await res.json();
            if (d.error) { showMessage(null, false, d.error); return; }
            if (!d.samples || !d.samples.length) {
                showMessage('detail.noSamples');
                return;
            }
            render(d);
        } catch (e) {
            showMessage('detail.connectionError');
            console.error(e);
        }
    }

    window.addEventListener('app-language-changed', () => {
        if (FORECAST) document.title = t('detail.forecastTitle');
        else document.title = t('detail.title');
        if (detailData) render(detailData);
        else if (detailMessage) showMessage(detailMessage.key, detailMessage.withBackLink, detailMessage.rawMessage);
    });

    showMessage('detail.loading');
    init();
</script>
</body>
</html>
